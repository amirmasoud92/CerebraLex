# Sensitivity analyses; none of these parameters was chosen from a decoding result.
fast_guess:                 # S-antic: responses at chance accuracy are guesses, not stimulus-driven
  step_s: 0.05              # Ratcliff & Tuerlinckx 2002, p. 442: raise the cutoff in small steps
  max_rt_s: 1.0             # search range; accuracy is 0.86 to 0.90 from 0.95 s onwards
  ci_level: 0.95            # Wilson interval per bin
  chance: 0.5               # two response buttons (left or right target)
# Further sensitivity analyses (configured where their parameters live):
#   S-bad30   bad-channel limit 0.30          -> preprocessing/preprocessing.yaml (bad_channels)
#   S-amp     amplitude outliers, 3 MAD       -> preprocessing/quality_control.yaml (amplitude_outlier_n_mad)
#   S-noICA   ICA ablation, exact reconstruction of the pre-ICA signal -> features/windows.py (uncleaned)
